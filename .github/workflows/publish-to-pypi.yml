# Publish sdvoe-discovery to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC) - no API token needed.
# Setup: https://docs.pypi.org/trusted-publishers/adding-a-publisher/

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No username/password: uses Trusted Publishing (OIDC).
          # Add this repo as a trusted publisher on pypi.org for the project.
          skip-existing: true
