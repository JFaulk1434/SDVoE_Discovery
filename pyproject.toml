[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdvoe-discovery"
version = "0.1.1"
description = "CLI and Python API to discover and control SDVoE devices (BlueRiver Control Server API and UDP broadcast)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["rich>=13.0.0"]
license = "MIT"
authors = [{ name = "SDVoE Discovery" }]
keywords = [
  "sdvoe",
  "discovery",
  "av-over-ip",
  "cli",
  "blueriver",
  "control-server",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/JFaulk1434/SDVoE_Discovery"
Repository = "https://github.com/JFaulk1434/SDVoE_Discovery"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sdvoe-discovery = "sdvoe_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdvoe_discovery*"]
