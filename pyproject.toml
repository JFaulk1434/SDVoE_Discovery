[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdvoe-discovery"
version = "0.1.0"
description = "CLI to discover SDVoE devices on the network and show device responses."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["rich>=13.0.0"]
license = { text = "MIT" }
authors = [
  { name = "SDVoE Discovery" }
]
keywords = ["sdvoe", "discovery", "av-over-ip", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sdvoe-discovery = "sdvoe_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdvoe_discovery*"]
